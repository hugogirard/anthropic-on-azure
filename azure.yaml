name: azd-anthropic-on-azure
metadata:
  template: azd-starter-bicep
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
    posix:
      shell: sh
      run: ./infra/hooks/preprovision.sh
